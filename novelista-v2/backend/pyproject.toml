[project]
name = "novelista-backend"
version = "0.1.0"
description = "Novelista backend — local-LLM novel generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=2.6",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit a real Ollama server (excluded by default)",
]
addopts = "-m 'not live' -q"
